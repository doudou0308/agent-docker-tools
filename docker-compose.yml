version: "3.9"

services:
  agent:
    image: chying-agent-docker-tools:latest
    container_name: chying-agent
    build:
      context: .
      dockerfile: Dockerfile
      # Uncomment the proxy args below if you need a proxy for builds
      # args:
      #   http_proxy: http://host.docker.internal:7897
      #   https_proxy: http://host.docker.internal:7897
    ports:
      - "127.0.0.1:8766:8766"   # GhidraMCP SSE for local clients
    volumes:
      - ./samples:/root/challenges:ro
      - ./scripts:/root/scripts:ro
      - ./ctf-solutions:/root/ctf-solutions
    environment:
      - http_proxy=http://host.docker.internal:7897
      - https_proxy=http://host.docker.internal:7897
      - no_proxy=localhost,127.0.0.1
      - CHYING_IN_CONTAINER=1
    cap_drop:
      - NET_RAW
    security_opt:
      - "no-new-privileges:true"
    stdin_open: true
    tty: true
    restart: unless-stopped
