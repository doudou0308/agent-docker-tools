name: Release checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests
      - run: bash -n docker/entrypoint.sh
      - run: bash tests/test_shutdown.sh
      - run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.debug.yml config --quiet

  core-smoke:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: compose.yml
    steps:
      - uses: actions/checkout@v4
      - name: Prepare standalone source archive
        run: |
          python3 scripts/package_core.py "$RUNNER_TEMP/agent-docker-tools-core.zip"
          unzip -q "$RUNNER_TEMP/agent-docker-tools-core.zip" -d "$RUNNER_TEMP"
      - run: |
          cd "$RUNNER_TEMP/agent-docker-tools-core"
          docker compose build --pull --no-cache
      - name: Check core image and host handshake
        run: |
          cd "$RUNNER_TEMP/agent-docker-tools-core"
          mkdir -p samples
          printf 'core smoke test\n' > samples/sample.txt
          docker compose up --no-build --wait --wait-timeout 180
          container=$(docker compose ps -q agent)
          test "$(docker compose port agent 8766)" = "127.0.0.1:8766"
          test "$(docker inspect "$container" --format '{{len .HostConfig.PortBindings}}')" = 1
          docker run --rm --network host \
            --entrypoint /opt/tools/ghidra-mcp/venv/bin/python agent-docker-tools:local \
            /opt/tools/ghidra-mcp/healthcheck.py --sse-only
          docker compose exec -T agent sh -ec '
            test -r /opt/tools/ghidra/LICENSE
            test -r /usr/share/doc/ghidra-mcp/copyright
            test -r /usr/share/doc/ghidra-mcp/NOTICE
            if touch /root/challenges/write-probe 2>/dev/null; then exit 1; fi
            if touch /root/scripts/write-probe 2>/dev/null; then exit 1; fi
            file /root/challenges/sample.txt > /root/ctf-solutions/sample-report.txt
          '
          grep -F 'text' ctf-solutions/sample-report.txt
          docker compose stop
          test "$(docker inspect "$container" --format '{{.State.ExitCode}}')" = 0
      - name: Check debug override
        run: |
          cd "$RUNNER_TEMP/agent-docker-tools-core"
          export COMPOSE_FILE="$COMPOSE_FILE:docker-compose.debug.yml"
          docker compose down
          docker compose up --no-build --wait --wait-timeout 180
          container=$(docker compose ps -q agent)
          cap_add=$(docker inspect "$container" --format '{{json .HostConfig.CapAdd}}')
          case "$cap_add" in '["SYS_PTRACE"]'|'["CAP_SYS_PTRACE"]') ;; *) exit 1 ;; esac
      - if: always()
        run: |
          cd "$RUNNER_TEMP/agent-docker-tools-core" || exit 0
          docker compose logs --no-color --tail=100 || true
          docker compose down
